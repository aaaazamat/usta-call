# Render.com avtomatik konfiguratsiyasi.
# Database tashqi servis (Neon.tech) — DATABASE_URL qo'lda kiritiladi.
#
# Yaratiladi:
#   - Web Service (Django + Daphne ASGI — HTTP va WebSocket)
#
# Foydalanish: Render dashboard'ida "New +" → "Blueprint" → repo'ni tanlang.

services:
  - type: web
    name: usta-call-backend
    runtime: python
    plan: free
    region: frankfurt    # eng yaqin Render mintaqasi
    buildCommand: "./build.sh"
    # Daphne — HTTP + WebSocket'larni qo'llab-quvvatlaydi
    startCommand: "daphne -b 0.0.0.0 -p $PORT config.asgi:application"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      # Database (Neon.tech) — qo'lda kiritiladi
      - key: DATABASE_URL
        sync: false
      # AI matching
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false      # qo'lda kiritiladi
      - key: AI_MODEL_GEMINI
        value: gemini-2.5-flash
      # Beta rejim (OTP'siz kirish — sinov uchun)
      - key: BETA_AUTO_LOGIN
        value: "True"
      # CORS — Vercel domeni keyinroq qo'shiladi
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SMS_PROVIDER
        value: console
